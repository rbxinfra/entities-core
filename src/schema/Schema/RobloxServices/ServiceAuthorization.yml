name: ServiceAuthorization

database: RobloxServices
table: ServiceAuthorizations

namespace: Roblox.Api.ControlPlane

version: 2

id:
  type: int

properties:
  - name: ServiceID
    description: Gets the service of the service authorization
    type: int
    nullable: false
    read_only: false
    foreign_key: "[dbo].[Services].[ID]"
  - name: ApiClientID
    description: Gets the api client of the service authorization
    type: int
    nullable: false
    read_only: false
    foreign_key: "[dbo].[ApiClients].[ID]"
  - name: AuthorizationTypeID
    description: Gets the authorization type of the service authorization
    type: byte
    nullable: false
    read_only: false
    foreign_key: "[dbo].[AuthorizationTypes].[ID]"
  - name: Created
    type: DateTime
    nullable: false
    read_only: false
  - name: Updated
    type: DateTime
    nullable: true
    read_only: false

methods:
  - name: GetByServiceIDAndApiClientID
    type: Lookup
    parameters:
      - name: serviceID
        type: int
      - name: apiClientID
        type: int
  
  - name: GetTotalNumberOfServiceAuthorizationsByServiceID
    type: GetCount
    parameters:
      - name: serviceID
        type: int

  - name: GetServiceAuthorizationsByServiceID
    type: GetCollectionPaged
    parameters:
      - name: serviceID
        type: int

  - name: GetTotalNumberOfServiceAuthorizationsByApiClientID
    type: GetCount
    parameters:
      - name: apiClientID
        type: int

  - name: GetServiceAuthorizationsByApiClientID
    type: GetCollectionPaged
    parameters:
      - name: apiClientID
        type: int
