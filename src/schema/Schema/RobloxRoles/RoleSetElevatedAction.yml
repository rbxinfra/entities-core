    type: int
    nullable: false
    read_only: false
    foreign_key: "[dbo].[RoleSets].[ID]"
  - name: ElevatedActionID
    description: Gets the id of the elevated action
    type: int
    nullable: false
    read_only: false
    foreign_key: "[dbo].[ElevatedActions].[ID]"
  - name: Created
    type: DateTime
    nullable: false
    read_only: true
  - name: Updated
    type: DateTime
    nullable: false
    read_only: true

methods:
  - name: Get
    type: Lookup
    parameters:
      - name: roleSetID
        type: int
      - name: elevatedActionID
        type: int

  - name: GetRoleSetElevatedActionsByRoleSetID
    dal_name: GetRoleSetElevatedActionIDsByRoleSetID
    type: GetCollection
    parameters:
      - name: roleSetID
        type: int
