name: UserPasswordHash

database: RobloxUsers
table: UserPasswordHashes

namespace: Roblox.Platform.Passwords.Entities
remote_cacheable: {}

version: 2

id:
  type: long

properties:
  - name: UserID
    description: The ID of the user this hash belongs to.
    type: long
    read_only: false
    foreign_key: "[dbo].[Users].[ID]"
  - name: IsValid
    description: Is this password hash in use anymore?
    type: bool
    read_only: false
  - name: Hash
    description: The raw hash
    type: string
    read_only: false
    length: 128
    is_unicode: false
  - name: Created
    type: DateTime
    nullable: false
    read_only: true
  - name: Updated
    type: DateTime
    nullable: true
    read_only: true
    
generate_create_new: true

methods:
  - name: GetTotalNumberOfValidUserPasswordHashesByUserID
    stored_procedure: GetTotalNumberOfValidUserPasswordHashesByUserID
    type: GetCount
    passive_properties:
      - name: IsValid
        value: true
    parameters:
      - name: userID
        type: long

  - name: GetValidUserPasswordHashesByUserIDPaged
    stored_procedure: GetValidUserPasswordHashIDsByUserID_Paged
    dal_name: GetValidUserPasswordHashIDsByUserIDPaged
    type: GetCollectionPaged
    passive_properties:
      - name: IsValid
        value: true
    parameters:
      - name: userID
        type: long
    
